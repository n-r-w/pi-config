description: Use for analytical or documentation tasks
prompt: |-
  Shared workflow goal: Perform analysis and produce evidence-backed conclusions autonomously.

  Shared rules:
  1. Work autonomously. No user confirmation stages.
  2. Follow KISS and YAGNI. Do not add content that does not support a conclusion, decision, or handoff.
  3. Ground every conclusion in evidence. Record each assumption together with how it will be verified. Do not present an assumption as a fact.
  4. Stop immediately when new facts contradict plan or a blocker cannot be resolved without violating it.
  5. Escalation: when a blocker requires user input, finish feasible work and report blocker in final report. Do not wait for user.
  6. NO OVERENGINEERING: REMEMBER, we're not building a "spaceship". ALWAYS CRITICALLY EVALUATE need to address edge cases based on their REALISM.

  No Overspecification:
  1. Keep output focused on what is essential for understanding and implementation.
  2. Do not attempt to capture every edge case or implementation detail during design phase, because some assumptions will inevitably be wrong.
  3. Over-specifying uncertain decisions can create inconsistencies and implementation errors.
  4. Leave non-essential details to implementation phase.
  5. KISS and YAGNI principles apply here as well.

stages:
  - id: collect_facts
    description: Collect facts without analysis
    model:
      thinking: low
    prompt: |-
      Goal: Build traceable raw evidence base for subsequent analysis.

      Subagents rules:
      1. MUST read primary documentation (specs, plans, etc.) yourself, not trusting subagents.
      2. Use subagents to collect additional information on codebase or logically related non-primary resources.

      Actions:
      1. Identify relevant information sources.
      2. Gather information: use appropriate subagents when needed.
      3. Store raw facts and evidence without interpretation, conclusions, or recommendations.
      4. Record source for each fact so it can be verified later.

      Constraints: MUST NOT go deep into the problem. Only collect relevant RAW facts!
    initial: true

  - id: understand_problem
    description: Understand problem, not solution
    model:
      thinking: high
    prompt: |-
      Goal: Establish evidence-backed understanding of problem, audience, and scope boundaries.

      Subagents: forbidden

      Actions:
      1. Study user request and collected facts.
      2. Understand problem, audience, and scope boundaries.
      3. Define open questions.
      4. Sort out open questions: resolve what can be resolved from evidence, record the rest for escalation.

      Rework rules:
      1. Return to `collect_facts` when problem understanding requires missing evidence.

      Constraints: MUST NOT discuss solution approaches or analysis methods. Only problem and domain understanding.

  - id: create_analysis_plan
    description: Create analysis plan
    model:
      thinking: high
    prompt: |-
      Goal: Produce minimal evidence-based analysis plan with explicit verification criteria.

      Subagents: if needed

      Actions:
      1. Draft analysis plan: questions to answer, methods, evidence sources, phases, verification criteria.
      2. Ground plan in collected facts and problem understanding.
      3. Apply KISS and YAGNI. Keep plan minimal.
      4. When a blocker requires user input, record it and propose possible resolutions without choosing one.

      Rework rules:
      1. Return to `understand_problem` when planning reveals misunderstood problem or scope.

      Constraints: Plan defines HOW to analyze, not how to solve the problem.

  - id: implement_analysis_plan
    description: Execute analysis plan
    model:
      thinking: high
    prompt: |-
      Goal: Produce organized evidence and conclusions according to analysis plan.

      Subagents: forbidden

      Actions:
      1. Execute each planned phase yourself. Do not delegate analysis to subagents.
      2. Follow only approved plan and scope.
      3. Collect and organize evidence produced by each phase.

      Rework rules:
      1. Return to `create_analysis_plan` when new evidence changes plan.
      2. Return to `understand_problem` when new evidence shows incorrect problem understanding.

  - id: verify_analysis
    description: Verify analysis implementation
    model:
      thinking: high
    prompt: |-
      Goal: Establish evidence of analysis completeness, plan conformance, and conclusion support.

      Subagents: forbidden

      Actions:
      1. Verify every plan phase is completed.
      2. Verify each conclusion is supported by collected evidence.
      3. Check for gaps, contradictions, and unsupported assumptions.

      Rework rules:
      1. Return to `implement_analysis_plan` when execution has unresolved issues.
      2. Return to `create_analysis_plan` when plan is flawed.

  - id: report_completion
    description: Provide Final Report
    model:
      thinking: medium
    triggers:
      - type: local_knowledge_accumulation
    prompt: |-
      Goal: Provide complete final record of analysis results, evidence, risks, and blockers.

      Subagents: forbidden

      Provide final feedback in format:
      1. Summary: brief overview of analysis done and conclusions
      2. Findings: key findings
      3. Evidence: supporting evidence for each conclusion
      4. Conclusions
      5. Open questions: anything user would need to confirm or revise
      6. Assumptions and how they will be verified
      7. Risks: any potential risks or issues that may arise
      8. Blockers: issues that require user input or decisions. Escalate clearly.

      Rework rules:
      1. Return to `verify_analysis` when final review reveals unsupported conclusion or verification gap.
      2. Return to `implement_analysis_plan` when requested changes require additional analysis execution.
      3. Return to `collect_facts` when requested changes require missing source evidence.
    final: true

transitions:
  - from: collect_facts
    to: understand_problem
    type: advance
  - from: understand_problem
    to: create_analysis_plan
    type: advance
  - from: create_analysis_plan
    to: implement_analysis_plan
    type: advance
  - from: implement_analysis_plan
    to: verify_analysis
    type: advance
  - from: verify_analysis
    to: report_completion
    type: advance
  - from: understand_problem
    to: collect_facts
    type: rework
  - from: create_analysis_plan
    to: understand_problem
    type: rework
  - from: implement_analysis_plan
    to: create_analysis_plan
    type: rework
  - from: verify_analysis
    to: implement_analysis_plan
    type: rework
  - from: report_completion
    to: verify_analysis
    type: rework
  - from: implement_analysis_plan
    to: understand_problem
    type: rework
  - from: verify_analysis
    to: create_analysis_plan
    type: rework
  - from: report_completion
    to: implement_analysis_plan
    type: rework
  - from: report_completion
    to: collect_facts
    type: rework
