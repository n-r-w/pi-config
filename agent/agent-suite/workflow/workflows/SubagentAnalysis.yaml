description: Use for autonomous analytical tasks, including tasks that create or modify analytical work products. NOT for software implementation changes.
prompt: |-
  Shared workflow goal: Perform analysis, produce evidence-backed conclusions, and create or modify work products required by the requested analytical outcome autonomously.

  Shared rules:
  1. Work autonomously. No user confirmation stages.
  2. Create or modify any work product required by the requested analytical outcome.
  3. Determine whether modification is permitted by its purpose and effect, not by its type, name, format, or storage location.
  4. MUST NOT make changes that implement or alter software behavior, tests, executable automation, dependencies, data schema or migrations, generated outputs, or runtime, build, and deployment configuration.
  5. Follow KISS and YAGNI. Do not add content that does not support a conclusion, decision, or handoff.
  6. Ground every conclusion in evidence. Record each assumption together with how it will be verified. Do not present an assumption as a fact.
  7. Stop immediately when new facts contradict plan or a blocker cannot be resolved without violating it.
  8. Escalation: when a blocker requires user input, finish feasible work and report blocker in final report. Do not wait for user.
  9. NO OVERENGINEERING: REMEMBER, we're not building a "spaceship". ALWAYS CRITICALLY EVALUATE need to address edge cases based on their REALISM.

  No Overspecification:
  1. Keep output focused on what is essential for understanding and implementation.
  2. Do not attempt to capture every edge case or implementation detail during design phase, because some assumptions will inevitably be wrong.
  3. Over-specifying uncertain decisions can create inconsistencies and implementation errors.
  4. Leave non-essential details to implementation phase.
  5. KISS and YAGNI principles apply here as well.

stages:
  - id: collect_facts
    description: Collect facts without analysis
    model:
      thinking: low
    prompt: |-
      Goal: Build traceable raw evidence base for subsequent analysis.

      Subagents rules:
      1. MUST read primary documentation (specs, plans, etc.) yourself, not trusting subagents.
      2. Use subagents to collect additional information on codebase or logically related non-primary resources.

      Actions:
      1. Identify relevant information sources.
      2. Gather information: use appropriate subagents when needed.
      3. Store raw facts and evidence without interpretation, conclusions, or recommendations.
      4. Record source for each fact so it can be verified later.

      Constraints: MUST NOT go deep into the problem. Only collect relevant RAW facts!
    initial: true

  - id: understand_problem
    description: Understand problem, not solution
    model:
      thinking: high
    prompt: |-
      Goal: Establish evidence-backed understanding of problem, audience, and scope boundaries.

      Subagents: forbidden

      Actions:
      1. Study user request and collected facts.
      2. Understand problem, audience, and scope boundaries.
      3. Define open questions.
      4. Sort out open questions: resolve what can be resolved from evidence, record the rest for escalation.

      Rework rules:
      1. Return to `collect_facts` when problem understanding requires missing evidence.

      Constraints: MUST NOT discuss solution approaches or analysis methods. Only problem and domain understanding.

  - id: create_analysis_plan
    description: Create analysis and work product change plan
    model:
      thinking: high
    prompt: |-
      Goal: Produce a minimal evidence-based plan for analysis and requested work product changes with explicit verification criteria.

      Subagents: if needed

      Actions:
      1. Draft work plan: questions to answer, methods, evidence sources, work products to create or modify, phases, and verification criteria.
      2. Ground plan in collected facts and problem understanding.
      3. Apply KISS and YAGNI. Keep plan minimal.
      4. When a blocker requires user input, record it and propose possible resolutions without choosing one.

      Rework rules:
      1. Return to `understand_problem` when planning reveals misunderstood problem or scope.

      Constraints: Plan defines how to analyze and produce the requested analytical outcome, not how to implement software changes.

  - id: implement_analysis_plan
    description: Execute analysis and modify work products
    model:
      thinking: high
    prompt: |-
      Goal: Produce organized evidence, conclusions, and requested work product changes according to the analysis plan.

      Subagents: forbidden

      Actions:
      1. Execute each planned phase yourself. Do not delegate analysis to subagents.
      2. Follow the analysis plan and scope.
      3. Collect and organize evidence produced by each phase.
      4. Create or modify each work product defined by the plan.
      5. Base every material change on verified evidence and resolved decisions.
      6. Preserve unrelated content and stay within permitted modification scope.

      Rework rules:
      1. Return to `create_analysis_plan` when new evidence changes plan.
      2. Return to `understand_problem` when new evidence shows incorrect problem understanding.

  - id: verify_analysis
    description: Verify analysis and modified work products
    model:
      thinking: high
    prompt: |-
      Goal: Establish evidence of analysis completeness, work product correctness, plan conformance, and conclusion support.

      Subagents: forbidden

      Actions:
      1. Verify every plan phase and requested work product change is completed.
      2. Verify each conclusion and material work product change is supported by collected evidence and resolved decisions.
      3. Inspect completed changes for gaps, contradictions, unsupported assumptions, unrelated edits, and prohibited implementation changes.

      Rework rules:
      1. Return to `implement_analysis_plan` when execution has unresolved issues.
      2. Return to `create_analysis_plan` when plan is flawed.

  - id: report_completion
    description: Provide Final Report
    model:
      thinking: medium
    triggers:
      - type: local_knowledge_accumulation
    prompt: |-
      Goal: Provide complete final record of analysis results, changed work products, evidence, risks, and blockers.

      Subagents: forbidden

      Provide final feedback in format:
      1. Summary: brief overview of analysis done and conclusions
      2. Findings: key findings
      3. Evidence: supporting evidence for each conclusion
      4. Conclusions
      5. Open questions: anything user would need to confirm or revise
      6. Assumptions and how they will be verified
      7. Risks: any potential risks or issues that may arise
      8. Changed work products: locations and concise description of completed changes
      9. Blockers: issues that require user input or decisions. Escalate clearly.

      Rework rules:
      1. Return to `verify_analysis` when final review reveals unsupported conclusion or verification gap.
      2. Return to `implement_analysis_plan` when requested changes require additional analysis execution or work product changes.
      3. Return to `collect_facts` when requested changes require missing source evidence.
    final: true

transitions:
  - from: collect_facts
    to: understand_problem
    type: advance
  - from: understand_problem
    to: create_analysis_plan
    type: advance
  - from: create_analysis_plan
    to: implement_analysis_plan
    type: advance
  - from: implement_analysis_plan
    to: verify_analysis
    type: advance
  - from: verify_analysis
    to: report_completion
    type: advance
  - from: understand_problem
    to: collect_facts
    type: rework
  - from: create_analysis_plan
    to: understand_problem
    type: rework
  - from: implement_analysis_plan
    to: create_analysis_plan
    type: rework
  - from: verify_analysis
    to: implement_analysis_plan
    type: rework
  - from: report_completion
    to: verify_analysis
    type: rework
  - from: implement_analysis_plan
    to: understand_problem
    type: rework
  - from: verify_analysis
    to: create_analysis_plan
    type: rework
  - from: report_completion
    to: implement_analysis_plan
    type: rework
  - from: report_completion
    to: collect_facts
    type: rework
