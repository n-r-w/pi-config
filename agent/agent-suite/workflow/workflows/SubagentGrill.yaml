description: Use for critical analysis by a subagent without direct user-alignment stages
prompt: |-
  Shared rules:
  1. Keep output focused on what is essential for understanding and implementation.
  2. Do not attempt to capture every edge case or implementation detail during design phase, because some assumptions will inevitably be wrong.
  3. Over-specifying uncertain decisions can create inconsistencies and implementation errors.
  4. Leave non-essential details to implementation phase.
  5. KISS and YAGNI principles apply here as well.
  6. NO OVERENGINEERING: REMEMBER, we're not building a "spaceship". ALWAYS CRITICALLY EVALUATE need to address edge cases based on their REALISM.

stages:
  - id: analyze_solution
    description: Analyze proposed solution and context
    prompt: |-
      Goal: Establish evidence-backed model of proposed solution, boundaries, intended behavior, and assumptions.

      Actions:
      1. Identify proposed solution, boundaries, intended behavior, and supplied evidence.
      2. Separate verified facts from assumptions and unresolved questions.
    initial: true

  - id: determine_goal
    description: Determine end goal and target outcome
    prompt: |-
      Goal: Establish end goal, target outcome, and material constraints.

      Actions:
      1. Determine problem being solved, end goal, and target outcome.
      2. Identify hidden assumptions or constraints that materially change evaluation.

      Rework rules:
      1. Return to `analyze_solution` when available context is insufficient to determine goal.

  - id: inspect_codebase
    description: Evaluate solution against real codebase
    prompt: |-
      Goal: Build codebase evidence for evaluating solution fit.

      Actions:
      1. Inspect relevant code, architecture, behavior, constraints, and project conventions.
      2. Identify claims or designs that lack sufficient code understanding.
      3. Verify that local changes fit global strategy.

      Rework rules:
      1. Return to `analyze_solution` when codebase evidence contradicts understood solution or its boundaries.

  - id: identify_findings
    description: Identify material issues and improvement opportunities
    prompt: |-
      Goal: Produce evidence-backed set of material critique findings.

      Actions:
      1. Identify errors, missing information, unnecessary complexity, premature detail, risks, and maintainability problems.
      2. Reject unsupported scenarios and temporary workarounds.
      3. Support each finding with evidence and a realistic occurrence scenario.

      Rework rules:
      1. Return to `inspect_codebase` when a candidate finding lacks sufficient evidence.

  - id: classify_findings
    description: Classify and deduplicate findings
    prompt: |-
      Goal: Produce deduplicated findings classified into required categories.

      Actions:
      1. Classify every finding into exactly one category:
         1) Misconceptions: errors in expectations, requirements, task understanding, logic, architecture, or established facts.
         2) Ambiguities: missing, incomplete, or materially unclear information or requirements.
         3) Overengineering: unnecessary complexity or abstractions, including solutions for unlikely or nonexistent scenarios.
         4) Overspecification: details that can be deferred without reducing required clarity or functionality.
      2. Keep categories separate and remove duplicate findings.

      Rework rules:
      1. Return to `identify_findings` when a finding cannot be assigned to exactly one category without revision.

  - id: verify_results
    description: Verify findings and obtain a second opinion
    prompt: |-
      Goal: Establish primary-source support, realism, and independent second opinion for every finding.

      Actions:
      1. Verify every finding against code or another primary source.
      2. Assess realism and likelihood of every reported scenario.
      3. Evaluate proposed solution against its end goal, global context, and verified codebase evidence.
      4. Use consult_advisor for a second opinion.
      5. Limit each recommendation to the required outcome and smallest complete correction.
      6. Do not design implementation or optional alternatives unless parent requests them.

      Rework rules:
      1. Return to `inspect_codebase` when verification identifies a material gap or error.

  - id: report_critique
    description: Deliver structured critical analysis
    triggers:
      - type: local_knowledge_accumulation
    prompt: |-
      Goal: Deliver structured evidence-backed critique through active collaboration channel.

      Actions:
      1. Brief summary of solution, goal, and context.
      2. Separate sections for Misconceptions, Ambiguities, Overengineering, and Overspecification.
      3. For each finding include: ID and summary; location; issue; impact; occurrence scenario; realism and probability; recommendation; verification method.
      4. State the required outcome and smallest complete correction in each recommendation.
      5. Do not design implementation or optional alternatives unless parent requests them.
      6. Include every category even when it has no findings.
      7. Deliver result through active collaboration channel.

      Rework rules:
      1. Return to `inspect_codebase` when parent feedback requires material changes.
      2. Return to `analyze_solution` when parent feedback changes proposed solution, context, or evaluation boundaries.
    final: true

transitions:
  - from: analyze_solution
    to: determine_goal
    type: advance
  - from: determine_goal
    to: inspect_codebase
    type: advance
  - from: inspect_codebase
    to: identify_findings
    type: advance
  - from: identify_findings
    to: classify_findings
    type: advance
  - from: classify_findings
    to: verify_results
    type: advance
  - from: verify_results
    to: report_critique
    type: advance

  - from: determine_goal
    to: analyze_solution
    type: rework
  - from: inspect_codebase
    to: analyze_solution
    type: rework
  - from: identify_findings
    to: inspect_codebase
    type: rework
  - from: classify_findings
    to: identify_findings
    type: rework
  - from: verify_results
    to: inspect_codebase
    type: rework
  - from: report_critique
    to: inspect_codebase
    type: rework
  - from: report_critique
    to: analyze_solution
    type: rework
