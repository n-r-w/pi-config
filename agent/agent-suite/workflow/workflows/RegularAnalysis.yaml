description: Use for regular analysis of code and technical artifacts
prompt: |-
  Shared workflow goal: Perform analysis and produce evidence-backed conclusions.

  Subagents: allowed ONLY by direct user request

  Shared workflow rules:
  1. Do not modify inspected files.
  2. Inspect only permitted scope.
  3. Support every reported finding or recommendation with inspected evidence.
stages:
  - id: define_scope
    description: Define inspection scope
    prompt: |-
      Goal: Defined inspection scope with permitted areas and excluded artifacts

      Required work:
      1. Determine files, changes, modules, or repository areas.
      2. Identify excluded generated code and out-of-scope artifacts.
      3. Stop and request clarification when inspection scope cannot be determined safely.
    initial: true

  - id: load_rules
    description: Load inspection rules
    prompt: |-
      Goal: Loaded rules and defined criteria for valid finding

      Required work:
      1. Load every relevant skill and project rules.
      2. Identify patterns, invariants, and exclusions that define a valid finding.

  - id: inspect_artifacts
    description: Inspect code and technical artifacts
    prompt: |-
      Goal: Evidence base with candidate findings and source locations

      Required work:
      1. Inspect permitted scope systematically.
      2. Record evidence and source locations for candidate findings.

  - id: verify_findings
    description: Verify findings are valid and material
    prompt: |-
      Goal: Validated list of material findings ready for report

      Required work:
      1. Verify each candidate against project behavior, rules, and context.
      2. Remove duplicate, speculative, insignificant, or out-of-scope findings.
      3. Return to inspection when evidence is incomplete.

  - id: report_findings
    description: Deliver findings using required format
    triggers:
      - type: local_knowledge_accumulation
    prompt: |-
      Goal: Delivered report with permitted findings, evidence, impact, and recommendations

      Required work:
      1. Report only findings permitted by scope rules.
      2. Include required source locations, evidence, impact, and recommendations.
      3. Deliver result through required channel.
      4. Return to inspection when parent feedback requires additional analysis.
    final: true

transitions:
  - from: define_scope
    to: load_rules
    type: advance
  - from: load_rules
    to: inspect_artifacts
    type: advance
  - from: load_rules
    to: define_scope
    type: rework
  - from: inspect_artifacts
    to: verify_findings
    type: advance
  - from: inspect_artifacts
    to: load_rules
    type: rework
  - from: verify_findings
    to: report_findings
    type: advance
  - from: verify_findings
    to: inspect_artifacts
    type: rework
  - from: report_findings
    to: verify_findings
    type: rework
  - from: report_findings
    to: inspect_artifacts
    type: rework
  - from: report_findings
    to: define_scope
    type: rework
