description: Use for regular analysis of code and technical artifacts, including tasks that create or modify analytical work products. NOT for software implementation changes.
model:
  thinking: high
prompt: |-
  Shared workflow goal: Perform analysis, produce evidence-backed conclusions, and create or modify work products required by the requested analytical outcome.

  Subagents: allowed ONLY by direct user request

  Shared rules:
  1. Create or modify any work product required by the requested analytical outcome.
  2. Determine whether modification is permitted by its purpose and effect, not by its type, name, format, or storage location.
  3. MUST NOT make changes that implement or alter software behavior, tests, executable automation, dependencies, data schema or migrations, generated outputs, or runtime, build, and deployment configuration.
  4. Inspect only permitted scope.
  5. Support every reported finding or recommendation with inspected evidence.
  6. NO OVERENGINEERING: REMEMBER, we're not building a "spaceship". ALWAYS CRITICALLY EVALUATE need to address edge cases based on their REALISM.

  User interview protocol:
  1. Follow `<user_communication>`
  2. Resolve questions that materially affect requested outcome until user and agent have confirmed shared understanding of problem, audience, core behavior, and scope.
  3. Do not make design decisions behind scenes. Obtain explicit user approval for decisions that affect scope, behavior, architecture or trade-offs.
  4. Traverse design tree depth-first: follow a newly opened question branch before returning to broader dimensions.
  5. Cover these dimensions when they affect requested output: problem and audience; core behavior and happy path; scope boundaries; UX states and transitions; platforms and performance, scale, security, and accessibility constraints; edge cases and failures.
  6. When problem, audience, or core behavior is unclear, start with a root round covering missing parts. Let answers determine next branch.
  7. Ask 1-4 related questions per round. Format decision questions according to `<user_communication>`
  8. Use an ASCII preview or option snippet when seeing choice makes decision easier.

  No Overspecification:
  1. Keep output focused on what is essential for understanding and implementation.
  2. Do not attempt to capture every edge case or implementation detail during design phase, because some assumptions will inevitably be wrong.
  3. Over-specifying uncertain decisions can create inconsistencies and implementation errors.
  4. Leave non-essential details to implementation phase.
  5. KISS and YAGNI principles apply here as well.

stages:
  - id: define_scope
    description: Define analysis and modification scope
    prompt: |-
      Goal: Establish explicit inspection and modification scope with permitted and excluded sources and work products.

      Actions:
      1. Determine sources to inspect and work products to create or modify.
      2. Identify permitted modifications, excluded implementation changes, and out-of-scope sources or work products.
      3. Stop and request clarification when inspection or modification scope cannot be determined safely.
    initial: true

  - id: load_rules
    description: Load inspection rules
    prompt: |-
      Goal: Establish applicable rules and criteria for valid findings and work product changes.

      Actions:
      1. Load every relevant skill and project rules.
      2. Identify patterns, invariants, and exclusions that define a valid finding or modification.

      Rework rules:
      1. Return to `define_scope` when loaded rules show inspection scope is invalid or incomplete.

  - id: inspect_artifacts
    description: Inspect code and technical artifacts
    prompt: |-
      Goal: Build evidence base of candidate findings with source locations.

      Actions:
      1. Inspect permitted scope systematically.
      2. Record evidence and source locations for candidate findings.

      Rework rules:
      1. Return to `load_rules` when inspected artifacts require additional project or domain rules.

  - id: verify_findings
    description: Verify findings are valid and material
    prompt: |-
      Goal: Produce evidence-backed set of material in-scope findings.

      Actions:
      1. Verify each candidate against project behavior, rules, and context.
      2. Remove duplicate, speculative, insignificant, or out-of-scope findings.

      Rework rules:
      1. Return to `inspect_artifacts` when evidence is incomplete.

  - id: produce_requested_outcome
    description: Produce requested analytical outcome
    prompt: |-
      Goal: Produce the requested analytical outcome from verified findings and evidence.

      Actions:
      1. Determine whether the requested outcome requires work product changes.
      2. When changes are required, create or modify the required work products.
      3. When changes are not required, keep work products unchanged and continue.
      4. Base every material change on verified findings, evidence, and approved decisions.
      5. Preserve unrelated content and stay within permitted modification scope.
      6. Inspect completed changes and correct unsupported, incomplete, or out-of-scope content.

      Rework rules:
      1. Return to `inspect_artifacts` when a required change lacks evidence.
      2. Return to `verify_findings` when a required change relies on an unverified finding.
      3. Return to `define_scope` when the required modification is outside permitted scope.

  - id: report_findings
    description: Deliver findings and completed work products
    triggers:
      - type: local_knowledge_accumulation
    prompt: |-
      Goal: Deliver requested outcome with findings, evidence, completed modifications, and remaining decisions.

      Actions:
      1. Report only findings and modifications permitted by scope rules.
      2. Include required source locations, evidence, impact, recommendations, and changed work product locations.
      3. Deliver result through required channel.

      Rework rules:
      1. Return to `produce_requested_outcome` when feedback requires in-scope work product changes.
      2. Return to `inspect_artifacts` when parent feedback requires additional analysis.
      3. Return to `verify_findings` when feedback requires revalidation without additional inspection.
      4. Return to `define_scope` when feedback changes permitted inspection or modification scope.
    final: true

transitions:
  - from: define_scope
    to: load_rules
    type: advance
  - from: load_rules
    to: inspect_artifacts
    type: advance
  - from: load_rules
    to: define_scope
    type: rework
  - from: inspect_artifacts
    to: verify_findings
    type: advance
  - from: inspect_artifacts
    to: load_rules
    type: rework
  - from: verify_findings
    to: produce_requested_outcome
    type: advance
  - from: verify_findings
    to: inspect_artifacts
    type: rework
  - from: produce_requested_outcome
    to: report_findings
    type: advance
  - from: produce_requested_outcome
    to: verify_findings
    type: rework
  - from: produce_requested_outcome
    to: inspect_artifacts
    type: rework
  - from: produce_requested_outcome
    to: define_scope
    type: rework
  - from: report_findings
    to: produce_requested_outcome
    type: rework
  - from: report_findings
    to: verify_findings
    type: rework
  - from: report_findings
    to: inspect_artifacts
    type: rework
  - from: report_findings
    to: define_scope
    type: rework
