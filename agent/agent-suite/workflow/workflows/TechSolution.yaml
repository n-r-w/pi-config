description: |-
  Use for technical design before implementation of features, bug fixes, etc. Contains 4 phases: problem -> prd -> tech-solution -> dry-run. MUST NOT be used for coding/implementation itself.
prompt: |-
  Shared workflow goal: Produce a technical solution for a problem with minimal requirements and design work.

  Shared rules:
  1. Follow `brainstorming` skill and `<user_communication>` rules
  2. Use `templates` and `anti-ambiguity` skills for artifacts.
  3. Follow KISS and YAGNI. Add content only when it supports a decision, review, handoff, or material risk.
  4. Ground claims in evidence. Record each assumption together with how it will be verified. Do not present an assumption as a fact.
  5. Treat Domain Glossary as terminology source of truth. Use its definitions in every artifact; define or update a term there before using a new or changed meaning elsewhere.
  6. Complete content work before style or formatting polish.
  7. Before completing each executed phase, apply `anti-ambiguity` skill and `No Overspecification` rules to its output and affected artifacts.
  8. Phase remains incomplete until its completion criteria and ambiguity review pass.
  9. MUST strictly follow `<user_communication>` rules

  No Overspecification:
  1. Keep output focused on what is essential for understanding and implementation.
  2. Do not attempt to capture every edge case or implementation detail during design phase, because some assumptions will inevitably be wrong.
  3. Over-specifying uncertain decisions can create inconsistencies and implementation errors.
  4. Leave non-essential details to implementation phase.
  5. KISS and YAGNI principles apply here as well.

  Interview protocol:
  1. Do not make design decisions behind scenes. Obtain explicit user approval for decisions that affect scope, behavior, architecture, trade-offs, or skipped phases.
  2. Traverse design tree depth-first: follow a newly opened question branch before returning to broader dimensions.
  3. Cover these dimensions when they affect requested output: problem and audience; core behavior and happy path; scope boundaries; UX states and transitions; platforms and performance, scale, security, and accessibility constraints; edge cases and failures.
  4. Start with a root round covering problem and audience plus core behavior. Let answers determine next branch.
  5. Ask 1-4 related questions per round. For each question, provide 2–4 concrete mutually exclusive options. Put recommended option first and label it `(Recommended)` only when there is evidence for a recommendation.
  6. Prefix short question in each decision question with a specific header chip no longer than 12 characters. Use an ASCII preview or option snippet when seeing choice makes decision easier.

  Output quality criteria:
  1. Keep artifacts simple, self-contained, and free of unnecessary duplication.
  2. Separate decisions from open questions.
  3. Before phase completion, check every requirement in output against explicit user approval.

  Constraints:
  1. MUST NOT create or modify files without explicit user approval.
  2. MUST NOT skip problem/prd/tech-solution phases without explicit user approval.

stages:
  - id: collect_facts
    description: Collect facts
    model:
      thinking: low
    prompt: |-
      Goal: Build evidence base for problem definition and technical design.

      Subagents rules:
      1. MUST read primary documentation (specs, plans, etc.) yourself, not trusting subagents.
      2. Use subagents to collect additional information on codebase or logically related non-primary resources.

      Required work:
      1. Identify relevant information sources
      2. Gather Information: execute appropriate subagents to gather different evidence
    initial: true

  - id: define_problem
    description: Create Problem Statement and Domain Glossary
    model:
      thinking: medium
    prompt: |-
      Goal: Obtain approved Problem Statement and Domain Glossary with no unresolved blockers.

      Subagents: forbidden

      Output:
        1. Problem Statement and Domain Glossary.
        2. If user ask to save PRD to file, use {relevant name}_problem.md file name.

      Required work:
      1. Understand problem and audience.
      2. Study provided materials, codebase, and documentation.
      3. Define problem statement and domain glossary.
      4. Record open questions.
      5. Sort out open questions with user, do not leave them quietly without discussion.

      Rework rules:
      1. Return to `collect_facts` when missing evidence blocks problem or terminology definition.

      Complete phase only when:
      1. Problem statement and domain glossary are defined
      2. No blocker remains
      3. All open questions are discussed with the user.
      4. Shared quality checks pass,
      5. Problem statement and domain glossary have been presented, then explicitly approved by user in a separate decision question.

      Constraints: At this stage, MUST NOT plan, discuss or define requirements, architecture, and technical solution. Only problem and domain area.

  - id: problem_defined
    description: Problem Statement and Domain Glossary defined
    model:
      thinking: medium
    prompt: |-
      Goal: Problem Statement and Domain Glossary remain approved and ready for requirements design.

      Subagents: forbidden

      Rework rules:
      1. Return to `define_problem` when user asks to rework Problem Statement or Domain Glossary.
    final: true

  - id: define_PRD
    description: Create Critical Requirements
    model:
      thinking: high
    prompt: |-
      Goal: Obtain approved Light PRD containing minimum critical requirements for solving problem.

      Output:
        1. Light Product Requirements Document (Light PRD)
        2. If user ask to save PRD to file, use {relevant name}_prd.md file name.

      Subagents: forbidden

      Required work:
      1. Identify minimum set of critical requirements needed to validate problem and solution.
      2. Identify open questions.
      3. Classify open questions as blockers or non-blockers:
        1) Blockers must be resolved and converted to requirements
        2) Non-blockers must be removed from Light PRD

      Requirement approval protocol:
      1. Final PRD must contain only requirements shown to and explicitly approved by user.
      2. Do not invent or synthesize additional requirements. Discuss a proposed requirement with user before adding it.
      3. When approval of any requirement is uncertain, omit it until explicit approval is obtained.

      Complete this phase only when:
      1. Critical requirements are defined
      2. No blocker remains
      3. Shared quality checks pass
      4. Light PRD has been presented, then explicitly approved by user in a separate decision question

      Rework rules:
      1. Return to `collect_facts` when missing evidence blocks requirement definition.
      2. Return to `define_problem` when requirement work reveals incorrect or reworked Problem Statement or Domain Glossary.

      Constraints:
        1. At this stage, MUST NOT discuss and define problem, domain glossary, and technical solution. Only requirements.
        2. Strictly follow `No Overspecification` guidelines.

  - id: PRD_defined
    description: Light PRD defined
    model:
      thinking: medium
    prompt: |-
      Goal: Light PRD remains approved and ready for technical design.

      Subagents: forbidden

      Rework rules:
      1. Return to `define_PRD` when user asks to rework Light PRD.
      2. Return to `define_problem` when feedback changes approved Problem Statement or Domain Glossary.
    final: true

  - id: define_technical_solution
    description: Create Technical Solution
    model:
      thinking: high
    prompt: |-
      Goal: Obtain approved Technical Solution that meets critical requirements and solves problem.

      Subagents: forbidden

      Output:
        1. Technical Solution.
        2. If user ask to save Technical Solution to file, use {relevant name}_solution.md file name.

      Required work:
      1. Define technical solution that meets critical requirements and is consistent with approved problem statement and domain glossary.

      Rework rules:
      1. Return to `define_PRD` when solution design reveals missing, ambiguous, or unsatisfied critical requirement.
      2. Return to `collect_facts` when technical decision lacks required evidence.
      3. Return to `define_problem` when solution design reveals incorrect Problem Statement or Domain Glossary.

      Complete this phase only when:
      1. Technical solution is defined
      2. No blocker remains
      3. Shared quality checks pass
      4. Technical solution has been presented, then explicitly approved by user in a separate decision question

  - id: dry_run
    description: Identify requirements and Technical Solution deficiencies
    model:
      thinking: high
    prompt: |-
      Goal: Critical Requirements and Technical Solution deficiencies are identified before implementation handoff.

      Subagents: if needed

      Output:
      1. When no blocker is found, report only that requirements and Technical Solution are ready for implementation.
      2. When blocker is found, return automatically to appropriate rework stage.
      3. Do not present implementation plan to user.

      Planning rules:
      1. Read relevant file contents before making decisions. Do not assume file contents.
      2. Build full plan with meaningful vertical slices, dependencies, execution order, tests, and verification.
      3. Analyze TDD applicability. Document RED-GREEN-REFACTOR sequence or justify why TDD provides no value.
      4. Resolve factual questions through codebase, documentation, and other available evidence.
      5. Make implementation decisions autonomously when evidence or project conventions provide one justified choice.
      6. Make implementation decisions autonomously when viable choices do not materially differ in scope, behavior, architecture, external contracts, trade-offs, or technical debt.
      7. Treat multiple viable branches as blocker when evidence cannot select one and choice affects scope, behavior, architecture, external contracts, material trade-offs, or technical debt. Do not request resolution during dry run.
      8. Do not convert implementation fact or constraint into critical requirement when it follows from approved artifacts, existing code, or project conventions.
      9. Leave details that do not affect plan to implementation stage.
      10. Stop research when evidence is sufficient to complete plan and evaluate implementation readiness.

      Required work:
      1. Map Technical Solution to existing code and project structure.
      2. Evaluate implementation approaches where unresolved choice affects plan.
      3. Build full actionable implementation plan.
      4. Identify blockers that require artifact revision or user decision.
      5. Revise plan after autonomously resolving factual questions and local implementation choices.
      6. Use implementation plan only as internal validation artifact.

      Rework rules:
      1. Return to `collect_facts` when missing or stale evidence prevents completion of implementation plan.
      2. Return to `define_problem` when planning invalidates approved Problem Statement or Domain Glossary.
      3. Return to `define_PRD` when planning reveals missing, ambiguous, or unsatisfied critical requirement.
      4. Return to `define_technical_solution` when planning reveals structural problem, material trade-off, or technical decision absent from Technical Solution.

      Complete this phase only when:
      1. Full actionable implementation plan is complete.
      2. Facts required by plan are established.
      3. Evidence-based and local implementation decisions are resolved autonomously.
      4. No unresolved branch requires user decision or approved artifact revision.
      5. Details that do not affect plan remain delegated to implementation stage.
      6. Shared quality checks pass.
      7. Successful result has been reported without presenting implementation plan.

      Constraints:
      1. MUST NOT modify code, tests, dependencies, or configuration.
      2. Strictly follow `No Overspecification` guidelines.

  - id: technical_solution_defined
    description: Technical Solution defined
    model:
      thinking: medium
    prompt: |-
      Goal: Technical Solution remains approved and ready for implementation handoff.

      Subagents: forbidden

      Rework rules:
      1. Return to `define_technical_solution` when user asks to rework Technical Solution.
      2. Return to `define_PRD` when feedback changes approved critical requirements.
      3. Return to `define_problem` when feedback changes approved Problem Statement or Domain Glossary.
    final: true

transitions:
  - from: collect_facts
    to: define_problem
    type: advance
  - from: collect_facts
    to: define_PRD
    type: advance
  - from: collect_facts
    to: define_technical_solution
    type: advance
  - from: define_problem
    to: problem_defined
    type: advance
  - from: define_problem
    to: define_PRD
    type: advance
  - from: define_PRD
    to: PRD_defined
    type: advance
  - from: define_PRD
    to: define_technical_solution
    type: advance
  - from: define_technical_solution
    to: dry_run
    type: advance
  - from: dry_run
    to: technical_solution_defined
    type: advance

  - from: define_problem
    to: collect_facts
    type: rework
  - from: problem_defined
    to: define_problem
    type: rework
  - from: define_PRD
    to: collect_facts
    type: rework
  - from: PRD_defined
    to: define_PRD
    type: rework
  - from: define_technical_solution
    to: define_PRD
    type: rework
  - from: define_technical_solution
    to: collect_facts
    type: rework
  - from: define_PRD
    to: define_problem
    type: rework
  - from: PRD_defined
    to: define_problem
    type: rework
  - from: define_technical_solution
    to: define_problem
    type: rework
  - from: dry_run
    to: collect_facts
    type: rework
  - from: dry_run
    to: define_problem
    type: rework
  - from: dry_run
    to: define_PRD
    type: rework
  - from: dry_run
    to: define_technical_solution
    type: rework
  - from: technical_solution_defined
    to: define_technical_solution
    type: rework
  - from: technical_solution_defined
    to: define_PRD
    type: rework
  - from: technical_solution_defined
    to: define_problem
    type: rework
