description: Use for coding tasks
prompt: |-
  Shared workflow goal: Solve user's problem by writing code.

  Shared workflow rules:
  1. Follow KISS and YAGNI. Do not add backward compatibility or fallback behavior without an explicit user requirement.
  2. Do not silently choose a local workaround over a broader structural fix because workaround is faster, more local, or appears to remain within scope.
  3. Stop immediately and report when new facts contradict approved plan or a blocker cannot be resolved without violating it.

  User interview protocol:
  1. Follow `<user_communication>`
  2. Interview user relentlessly on every aspect until you reach a common understanding.
  3. Do not make design decisions behind scenes. Obtain explicit user approval for decisions that affect scope, behavior, architecture, trade-offs, or skipped phases.
  4. Traverse design tree depth-first: follow a newly opened question branch before returning to broader dimensions.
  5. Cover these dimensions when they affect requested output: problem and audience; core behavior and happy path; scope boundaries; UX states and transitions; platforms and performance, scale, security, and accessibility constraints; edge cases and failures.
  6. Start with a root round covering problem and audience plus core behavior. Let answers determine next branch.
  7. Ask 1-4 related questions per round. For each question, provide 2–4 concrete mutually exclusive options. Put recommended option first and label it `(Recommended)` only when there is evidence for a recommendation.
  8. Prefix short question in each decision question with a specific header chip no longer than 12 characters.. Use an ASCII preview or option snippet when seeing choice makes decision easier.

stages:
  - id: collect_project_state
    description: Collect Project State
    model:
      thinking: low
    prompt: |-
      Goal: Establish project baseline for regression detection.

      Subagents rules:
      1. Subagents are required
      2. Your role delegation ONLY. ALL job MUST BE delegated to subagents.

      Required work: Execute appropriate subagents to collect current project state. Collect issues for entire project, not only requested scope, to establish a baseline for detecting regressions:
        1. Linting issues. Respect project-specific partial linting scopes such as `new-from-rev=origin/master` when configured
        2. Testing issues
        3. Build status
        4. Test coverage
    initial: true

  - id: collect_facts
    description: Collect facts
    model:
      thinking: low
    prompt: |-
      Goal: Build evidence base for problem and requirements alignment.

      Subagents rules:
      1. MUST read primary documentation (specs, plans, etc.) yourself, not trusting subagents.
      2. Use subagents to collect additional information on codebase or logically related non-primary resources.

      Required work:
      1. Identify relevant information sources
      2. Gather Information: execute appropriate subagents to gather different evidence

      Rework rules:
      1. Return to `collect_project_state` when collected evidence shows project baseline is incomplete or stale.

      Constraints:
      1. MUST NOT go deep into the problem. Only collect relevant RAW facts!
      2. NO code modifications.

  - id: align_problem
    description: Align problem being solved with user's needs.
    model:
      thinking: medium
    prompt: |-
      Goal: Establish shared understanding of problem and target outcome.

      Subagents rules: subagents forbidden

      Required work:
      1. Understand user's problem
      2. Study provided materials, codebase, and documentation
      3. Define open questions
      4. Sort out open questions with user, do not leave them quietly without discussion
      5. Present how you understand task and which parts of problem are being solved
      6. Ask clarifying questions when required for alignment
      7. Wait for explicit user confirmation that target outcome is understood correctly

      Rework rules:
      1. Return to `collect_facts` when alignment requires missing repository or domain evidence.

      Constraints: NO code modifications.

  - id: align_requirements
    description: Align requirements with user's needs
    model:
      thinking: high
    prompt: |-
      Goal: Establish minimum critical requirements for solving problem.

      Subagents rules:
      1. Use appropriate subagents to evaluate approaches when complexity or uncertainty is high.
      2. Critically evaluate subagent's results, MUST NOT blindly trust them, as subagents can also make mistakes.

      Required work:
      1. Identify minimum set of critical requirements needed to solve problem
      2. Identify open questions.
      3. Classify open questions as blockers or non-blockers:
        1) Blockers must be resolved and converted to requirements
        2) Non-blockers must be removed from requirements

      Rework rules:
      1. Return to `align_problem` when requirements reveal misunderstood problem or target outcome.
      2. Return to `collect_facts` when evidence is insufficient to define or classify critical requirements.

      No Overspecification:
      1. Keep output focused on what is essential for understanding and implementation.
      2. Do not attempt to capture every edge case or implementation detail during design phase, because some assumptions will inevitably be wrong.
      3. Over-specifying uncertain decisions can create inconsistencies and implementation errors.
      4. Leave non-essential details to implementation phase.
      5. KISS and YAGNI principles apply here as well.

      Constraints: NO code modifications.

  - id: create_plan
    description: Evaluate approaches and create plan
    model:
      thinking: high
    prompt: |-
      Goal: Produce evidence-based actionable implementation plan.

      Subagents rules:
      1. Use appropriate subagents to evaluate approaches when complexity or uncertainty is high.
      2. Critically evaluate subagent's results, MUST NOT blindly trust them, as subagents can also make mistakes.

      Planning rules:
      1. Read relevant file contents before making decisions. Do not assume file contents.
      2. Do not plan backward compatibility or fallback behavior without an explicit user requirement.
      3. Analyze dependencies and potential effects on related components.
      4. Identify open questions and uncertainties that require user input or further research before planning.
      5. Stop research when there is enough context to draft plan. Leave implementation details that do not affect plan to implementation stage.

      Rework rules:
      1. Return to `align_requirements` when approach evaluation reveals missing or incorrect critical requirements.
      2. Return to `align_problem` when approach evaluation reveals misunderstood problem or target outcome.
      3. Return to `collect_facts` when evidence is insufficient to evaluate approaches or dependencies.

      Break work into vertical slices:
      1. Each slice cuts a narrow but COMPLETE path through every layer (schema, API, UI, tests) — vertical, NOT a horizontal slice of one layer
      2. A completed slice is demoable or verifiable on its own
      3. Each slice is sized to fit in a single fresh context window
      4. Any prefactoring should be done first
      5. Follow TDD principles if possible: RED -> GREEN -> REFACTOR. Slices should preserve testability whenever practical.
      6. Keep slices meaningful, testable, and easy to review. Avoid slices that are so small they add process overhead or so large they hide risk.
      7. Combine setup and verification work when separating them would leave system in a hard-to-test or misleading intermediate state.
      8. Include final cleanup step that removes temporary code, workarounds, debugging artifacts, and other implementation residue.
      9. Critical risk: trying to make every slices testable can easily lead to inventing unnecessary logic and tests that will not provide real value when looking at task as a whole.

      Required work:
      1. Draft two or three possible approaches.
      2. Evaluate each approach's complexity, maintainability, performance, risks, and trade-offs.
      3. Use additional independent analyst perspectives when needed.
      4. Select best approach from evidence.
      5. Apply KISS and YAGNI. Revise approach when it contains unnecessary complexity.
      6. Break selected approach into actionable slices.
      7. TDD (RED-GREEN-REFACTOR) MUST be analyzed, justified, and explicitly documented in plan, even if it not required.

      Constraints: NO code modifications

  - id: resolve_open_questions
    description: Open Question Analysis
    model:
      thinking: high
    prompt: |-
      Goal: Reach planning state with no unresolved blocking questions.

      Subagents rules: use subagents if it helps

      Steps if open questions exist:
      1. Categorize them by focus area, complexity, risk, and other dimensions that affect resolution.
      2. Rank them by their effect on final result and associated risks.
      3. Resolve factual questions through codebase, documentation, web resources, and other available evidence.
      4. Do not replace missing answers with assumptions.
      5. Present unresolved questions that require user input. Do not proceed while a blocking question remains unresolved.

      Rework rules:
      1. Return to `create_plan` when resolved answers require plan revision.

  - id: confirm_plan
    description: Plan Confirmation
    model:
      thinking: high
    prompt: |-
      Goal: Obtain explicitly approved implementation plan.

      Subagents rules: subagents forbidden

      Required work:
      1. Present problem and plan:
        1) Present problem approved during `Align problem` stage and implementation plan
        2) Use concise, plain language and keep presentation within one screen when possible
        3) Explain every material trade-off. When an option introduces technical debt, state what becomes coupled, duplicated, obscured, harder to test, or harder to change later
      2. Obtain approval:
        1) Wait for user to review plan and explicitly authorize implementation
        2) Do not start implementation before clear and explicit approval
        3) Approval requires an unambiguous statement such as "start implementation." Statements such as "we need to make it so that" or "the plan looks good" do not authorize implementation
        4) Approval in initial task request does not satisfy this stage

      Rework rules:
      1. Return to `create_plan` when user requests plan changes. Revise plan and present it again.
      2. Return to `resolve_open_questions` when plan review reveals unresolved blocking question.

      Constraints: NO code modifications

  - id: implement_plan
    description: Implement plan
    model:
      thinking: medium
    prompt: |-
      Goal: Produce implementation matching approved plan.

      Subagents rules:
      1. Subagents are required
      2. Your role is subagent's orchestration and verification
      3. Execute one imdependent subagent per planned slice
      4. Critically evaluate subagent's verification results, MUST NOT blindly trust them, as subagents can also make mistakes

      Required work:
      1. Choose most applicable subagent's to implement each planned task
      2. Execute only approved plan and scope
      3. Do not silently accept technical debt revealed after plan approval
      4. When approved plan contains an error or inefficient solution, stop and report it
      5. For runtime behavior changes, create or update a failing test before production code, confirm expected RED failure, implement smallest passing change, confirm GREEN, then refactor
      6. Do not include task, plan, or phase/slice references in code comments

      Rework rules:
      1. Return to `create_plan` when implementation reveals structural problem or trade-off absent from plan.
      2. Return to `confirm_plan` when implementation can continue only after renewed approval of updated plan.

  - id: verify_implementation
    description: Verify implementation
    model:
      thinking: medium
    prompt: |-
      Goal: Establish evidence that implementation matches user request and approved plan without regressions or residue.

      Subagents rules:
      1. Subagents forbidden

      Required work:
      1. Run full test suite, linters and other project checks.
      2. Confirm that implementation meets user request and approved plan.
      3. Identify and address issues caused by implementation.
      4. Identify temporary code, workarounds, debugging artifacts, and code slop introduced during implementation.

      Rework rules:
      1. Return to `implement_plan` when implementation problems or unresolved issues require changes.

      Constraints: MUST NOT fix issues during this step, VERIFICATION ONLY.

  - id: acceptance_of_result
    description: Acceptance of result by user
    model:
      thinking: medium
    prompt: |-
      Goal: Obtain user acceptance of implementation result.

      Subagents rules: subagents forbidden

      Required work:
      1. Stop and present implementation results to user:
          1) Full test suite, linters and other project checks results
          2) Key changes you made
          3) Any deviations from approved plan
          4) Any decisions outside of approved plan
      2. Wait for user feedback.
      3. Complete stage when user accepts results.

      Rework rules:
      1. Return to `verify_implementation` when user requests renewed verification without implementation changes.
      2. Return to `implement_plan` when user requests implementation changes, then present updated results again.

      Constraints: NO code modifications.

  - id: deep_review
    description: Deeply review implementation results
    model:
      thinking: medium
    prompt: |-
      Goal: Establish independent evidence of implementation correctness, completeness, quality, and regression safety.

      Subagents rules:
      1. Subagents are required
      2. Your role is subagent's orchestration and verification
      3. Critically evaluate subagent's verification results, MUST NOT blindly trust them, as subagents can also make mistakes.

      Choose appropriate review subagent(s):
        1) Review subagent to verify that all user requirements and goals are met.
        2) Subagent to examine edge cases, overengineering, and attempts to solve nonexistent or unlikely scenarios.
        3) Subagent to identify safe simplification opportunities.
        4) Subagent to identify code slop that can be removed.
        5) Subagent to check that implementation introduced no new linting issues, testing issues, or build failures and did not reduce test coverage.

      Rework rules:
      1. Return to `acceptance_of_result` when review changes result information that requires renewed user acceptance.
      2. Return to `implement_plan` when review finds implementation defect or required cleanup.

      Constraints: NO code modifications.

  - id: report_completion
    description: Provide Final Report
    triggers:
      - type: local_knowledge_accumulation
    model:
      thinking: medium
    prompt: |-
      Goal: Provide complete final record of delivered result.

      Subagents rules: subagents forbidden

      Provide final feedback in format:
      1. Summary: brief overview of work done and results achieved
      2. Design decisions: choices you made where spec was ambiguous
      3. Deviations: places where you intentionally departed from spec, and why
      4. Tradeoffs:  alternatives you considered and why you picked what you did
      5. Open questions: anything you'd want me to confirm or revise
      6. TODOs, FIXMEs, or technical debt introduced
      7. Deprecations: features, functions, or components that were deprecated
      8. Risks: any potential risks or issues that may arise
      9. Present Commit Message to User: present commit message for your changes in conventional commit format. Choose language based on project conventions. If no conventions exist, use English.

      Rework rules:
      1. Return to `deep_review` when final report reveals incomplete review evidence.
      2. Return to `implement_plan` when user requests implementation changes.
      3. Return to `collect_project_state` when work must restart with refreshed project baseline.

      Constraints: NO code modifications.
    final: true

transitions:
  - from: collect_project_state
    to: collect_facts
    type: advance
  - from: collect_facts
    to: align_problem
    type: advance
  - from: align_problem
    to: align_requirements
    type: advance
  - from: align_requirements
    to: create_plan
    type: advance
  - from: create_plan
    to: resolve_open_questions
    type: advance
  - from: resolve_open_questions
    to: confirm_plan
    type: advance
  - from: confirm_plan
    to: implement_plan
    type: advance
  - from: implement_plan
    to: verify_implementation
    type: advance
  - from: verify_implementation
    to: acceptance_of_result
    type: advance
  - from: acceptance_of_result
    to: deep_review
    type: advance
  - from: deep_review
    to: report_completion
    type: advance

  - from: collect_facts
    to: collect_project_state
    type: rework
  - from: align_problem
    to: collect_facts
    type: rework
  - from: align_requirements
    to: align_problem
    type: rework
  - from: align_requirements
    to: collect_facts
    type: rework
  - from: create_plan
