description: Use for analyzing and merging/rebasing changes from different Git branches
prompt: |-
  Shared workflow goal: Perform merge/rebase while maintaining correct business logic.

  Shared rules:
  1. Migrations from master have priority over migrations from current branch. When both branches contain same migration number, keep master migration number and assign next available number to current-branch migration.
  2. Do not perform a commit, push, or merge operation without explicit user approval.
  3. Do not modify code that was unchanged by merge without explicit user approval.
  4. MUST strictly follow `<user_communication>` rules
  5. Since it is necessary to understand ESSENCE of current and incoming changes, any restrictions on reading documentation related to changes (if any) are REMOVED.

stages:
  - id: collect_facts
    description: Collect facts
    model:
      thinking: low
    prompt: |-
      Goal: Build raw evidence base for merge analysis.

      Subagents: Use appropriate subagents when complexity or uncertainty is high.

      Actions:
      1. Independently (without subagents) determine branches to merge.
      2. Collect information about changes in branches, conflicts, etc.

      Constraints:
      1. MUST NOT go deep into problem.
      2. MUST NOT discuss problems, solutions, etc.
      3. Only collect relevant RAW facts!
    initial: true

  - id: classify_changes
    description: Classify conflicts and interacting changes
    model:
      thinking: medium
    prompt: |-
      Goal: Establish evidence-backed classification of conflicts and interacting changes.

      Subagents: forbidden

      Classify changes into:
      1. Technical conflicts that do not affect code logic, such as import ordering or formatting differences.
      2. Logical conflicts involving algorithms, business logic, or other behavior.
      3. Changes that do not conflict textually but may break overall business logic when combined.

      Support every classification with repository evidence.

      Rework rules:
      1. Return to `collect_facts` when evidence is insufficient to classify affected changes.

      Constraints: MUST NOT discuss problems, solutions, etc.

  - id: align_problem
    description: Align problem being solved with user's needs.
    model:
      thinking: medium
    prompt: |-
      Goal: Establish shared understanding of merge problem and target outcome.

      Subagents: forbidden

      Actions:
      1. Understand user's problem
      2. Study provided materials, codebase, and documentation.
      3. Define open questions.
      4. Sort out open questions with user, do not leave them quietly without discussion.
      5. Present how you understand task and which parts of problem are being solved.
      6. Ask clarifying questions when required for alignment.
      7. Wait for explicit user confirmation that target outcome is understood correctly.

      Rework rules:
      1. Return to `classify_changes` when alignment changes merge scope or invalidates conflict classification.

  - id: create_plan
    description: Evaluate approaches and create plan
    model:
      thinking: high
    prompt: |-
      Goal: Produce evidence-based conflict resolution plan that preserves combined business logic.

      Planning rules:
      1. Read relevant file contents before making decisions. Do not assume file contents.
      2. Do not plan backward compatibility or fallback behavior without an explicit user requirement.
      3. Analyze dependencies and potential effects on related components.
      4. Identify open questions and uncertainties that require user input or further research before planning.
      5. Stop research when there is enough context to draft plan. Leave implementation details that do not affect plan to implementation stage.
      6. Include a final phase for independent verification.

      Rework rules:
      1. Return to `align_problem` when planning reveals misunderstood merge problem or target outcome.

      Subagents rules:
      1. Use appropriate subagents to evaluate approaches when complexity or uncertainty is high.
      2. Critically evaluate subagent's results, MUST NOT blindly trust them, as subagents can also make mistakes.

  - id: resolve_open_questions
    description: Open Question Analysis
    model:
      thinking: high
    prompt: |-
      Goal: Reach planning state with no unresolved blocking questions.

      Subagents: if needed

      Steps if open questions exist:
      1. Categorize them by focus area, complexity, risk, and other dimensions that affect resolution.
      2. Rank them by their effect on final result and associated risks.
      3. Resolve factual questions through codebase, documentation, web resources, and other available evidence.
      4. Do not replace missing answers with assumptions.
      5. Present unresolved questions that require user input. Do not proceed while a blocking question remains unresolved.

      Rework rules:
      1. Return to `create_plan` when resolved answers require conflict resolution plan revision.

  - id: confirm_resolution_plan
    description: Present conflict classification and obtain approval for resolution plan
    model:
      thinking: medium
    prompt: |-
      Goal: Obtain approved conflict resolution plan with required Git operation authorizations.

      Subagents: forbidden

      Actions:
      1. Present conflict classification and a plan for resolving each category.
      2. Explain how plan preserves codebase's overall behavior and integrity.
      3. Obtain explicit user approval for plan before resolving conflicts.
      4. Obtain explicit user approval before any commit, push, or merge operation included in plan.

      Rework rules:
      1. Return to `classify_changes` when user rejects conflict classification.
      2. Return to `create_plan` when user rejects conflict resolution plan.
      3. Return to `resolve_open_questions` when plan review reveals unresolved blocking question.

  - id: resolve_conflicts
    description: Resolve conflicts according to approved plan
    model:
      thinking: high
    prompt: |-
      Goal: Produce conflict-resolved working tree matching approved plan.

      Subagents: required

      Actions:
      1. Choose most applicable subagent's to implement each planned task.
      2. Resolve technical conflicts first.
      3. Resolve logical conflicts together with non-conflicting changes that may break overall business logic.
      4. Apply migration priority rule from Shared rules.
      5. Change only files and behavior covered by approved plan.
      6. Do not perform a commit, push, or merge operation without explicit user approval.
      7. Treat task, ticket, phase, stage, slice, plan, and agent labels as workflow metadata. MUST NOT put them in code artifacts unless required domain or external-contract terms.
      8. Before validation or any approved commit, inspect changed code and remove leaked workflow metadata. Name artifacts after domain behavior.
      9. Finally, run full test suite, linters and other project checks.

      Rework rules:
      1. Return to `classify_changes` when new evidence changes approved conflict model.
      2. Return to `create_plan` when new evidence invalidates conflict resolution plan.
      3. Return to `confirm_resolution_plan` when resolution requires renewed user approval.

  - id: validate_merge
    description: Validate merged code and distinguish new failures from existing ones
    model:
      thinking: high
    prompt: |-
      Goal: Establish evidence that merged code preserves target business logic and introduces no new failures.

      Subagents: forbidden

      Actions:
      1. Ensure that merged code is functional and introduces no new errors.
      2. Run full test suite, linters and other project checks, if their weren't run in `resolve_conflicts`.
      3. Before fixing a failure found after merge, determine whether it was already present in either source branch.
      4. Critically evaluate subagent's verification results, MUST NOT blindly trust them, as subagents can also make mistakes.
      5. Do not modify code that was unchanged by merge without explicit user approval.
      6. Confirm merged code contains no workflow metadata unless required by domain behavior or external contract.

      Rework rules:
      1. Return to `resolve_conflicts` when validation identifies a merge-caused issue.

  - id: report_completion
    description: Present validated result and commit message
    model:
      thinking: medium
    prompt: |-
      Goal: Provide complete final record of validated merge result.

      Subagents: forbidden

      Actions:
      1. Present resolved conflicts, validation evidence, remaining risks, and any unresolved issues.
      2. Present a brief conventional commit message. Use project's language convention; use English when no convention exists.
      3. Wait for user feedback.

      Rework rules:
      1. Return to `resolve_conflicts` when user requests changes.
      2. Return to `validate_merge` when feedback requires renewed validation without conflict changes.
      3. Return to `classify_changes` when feedback changes branches or merge scope.
      4. Return to `collect_facts` when feedback reveals missing or stale branch evidence needed to reclassify changes.
    final: true

transitions:
  - from: collect_facts
    to: classify_changes
    type: advance
  - from: classify_changes
    to: align_problem
    type: advance
  - from: align_problem
    to: create_plan
    type: advance
  - from: create_plan
    to: resolve_open_questions
    type: advance
  - from: resolve_open_questions
    to: confirm_resolution_plan
    type: advance
  - from: confirm_resolution_plan
    to: resolve_conflicts
    type: advance
  - from: resolve_conflicts
    to: validate_merge
    type: advance
  - from: validate_merge
    to: report_completion
    type: advance
  - from: classify_changes
    to: collect_facts
    type: rework
  - from: align_problem
    to: classify_changes
    type: rework
  - from: create_plan
    to: align_problem
    type: rework
  - from: resolve_open_questions
    to: create_plan
    type: rework
  - from: confirm_resolution_plan
    to: resolve_open_questions
    type: rework
  - from: resolve_conflicts
    to: confirm_resolution_plan
    type: rework
  - from: validate_merge
    to: resolve_conflicts
    type: rework
  - from: report_completion
    to: validate_merge
    type: rework
  - from: confirm_resolution_plan
    to: classify_changes
    type: rework
  - from: confirm_resolution_plan
    to: create_plan
    type: rework
  - from: resolve_conflicts
    to: classify_changes
    type: rework
  - from: resolve_conflicts
    to: create_plan
    type: rework
  - from: report_completion
    to: resolve_conflicts
    type: rework
  - from: report_completion
    to: classify_changes
    type: rework
  - from: report_completion
    to: collect_facts
    type: rework
